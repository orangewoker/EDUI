name: Build EDUI iOS IPA

on:
  push:
    branches: [ios]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edui-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Configure WidgetKit target
        run: ruby ios/setup_widget_target.rb

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: |
          flutter test --no-pub
          python3 -m unittest tool/test_update_altstore_source.py
          python3 tool/update_altstore_source.py altstore-source.json --check

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Validate app and WidgetKit bundle metadata
        run: python3 tool/verify_ios_bundle.py build/ios/iphoneos/Runner.app

      - name: Read version
        id: version
        shell: bash
        run: |
          FULL_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          echo "version=${FULL_VERSION%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${FULL_VERSION##*+}" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/EDUI.app
          cd build/ios/unsigned-ipa
          zip -qry "../EDUI-${VERSION}-unsigned.ipa" Payload

      - name: Package SideStore-ready IPA
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="$PWD"
          rm -rf build/ios/sidestore-ipa
          mkdir -p build/ios/sidestore-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/sidestore-ipa/Payload/EDUI.app
          APP="build/ios/sidestore-ipa/Payload/EDUI.app"
          WIDGET="$APP/PlugIns/EDUIWidget.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements ios/EDUIWidget/EDUIWidget.entitlements "$WIDGET"
          codesign --force --sign - --timestamp=none \
            --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/edui-app-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$WIDGET" > /tmp/edui-widget-entitlements.plist 2>/dev/null
          grep -q 'group.com.orangewoker.edui' /tmp/edui-app-entitlements.plist
          grep -q 'group.com.orangewoker.edui' /tmp/edui-widget-entitlements.plist
          cd build/ios/sidestore-ipa
          zip -qry "../EDUI-${VERSION}-sidestore.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EDUI-ios-ipa
          path: |
            build/ios/EDUI-*-unsigned.ipa
            build/ios/EDUI-*-sidestore.ipa

      - name: Publish unsigned IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EDUI iOS ${{ steps.version.outputs.version }}
          body: EDUI iOS IPA with WidgetKit extension. Use the sidestore asset with SideStore so App Group metadata is preserved.
          prerelease: true
          files: |
            build/ios/EDUI-${{ steps.version.outputs.version }}-unsigned.ipa
            build/ios/EDUI-${{ steps.version.outputs.version }}-sidestore.ipa

      - name: Update SideStore source
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/ios-v${VERSION}/EDUI-${VERSION}-sidestore.ipa"
          python3 tool/update_altstore_source.py altstore-source.json \
            --ipa "build/ios/EDUI-${VERSION}-sidestore.ipa" \
            --version "$VERSION" \
            --build-version "$BUILD" \
            --download-url "$DOWNLOAD_URL" \
            --description "EDUI ${VERSION}：额度监控与小组件体验更新。"
          python3 tool/update_altstore_source.py altstore-source.json --check

      - name: Publish SideStore source manifest
        shell: bash
        run: |
          if git diff --quiet -- altstore-source.json; then
            echo "SideStore source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "Update SideStore source for ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:ios
